# local-vlm 서빙 앞단 LB (nginx)
#
# 역할: DP 레플리카 N개 앞에서 요청을 분배하고, 두 팀에 단일 주소(:8000)를 제공한다.
#       docs/01 이 정한 공개 주소가 http://${STRAD32_IP}:8000/v1 이다.
#
# 왜 nginx 인가 (docs/04 §3 후보 중)
#   가동 검증 게이트 2 실측 결과 이 모델은 prefix caching 이 자동 비활성화된다
#   (enable_prefix_caching=False). 따라서 sglang_router / vllm-router 의 강점인
#   캐시 인지 라우팅이 무의미하고, 단순 least_conn 으로 충분하다.
#   API 키·쿼터·로깅이 필요해지면 LiteLLM proxy 로 교체 검토.

# 레플리카 수를 바꾸면 아래 server 줄과 scripts/serve.sh 의 GPUS 를 함께 고쳐야 한다.
# serve.sh 는 기동 시 두 값의 개수가 어긋나면 거부한다.
upstream vllm_backend {
    # zone 이 없으면 워커마다 peer 상태를 자기 사본으로만 들고 있다.
    # 이 컨테이너는 cpuset 32코어 + worker_processes auto = 워커 32개이므로,
    # 동시 요청이 서로 다른 워커에 떨어지고 각 워커 눈에는 두 peer 모두 active=0 →
    # 타이 → 목록 첫 peer 고정. 실측: 동시 6요청이 전부 r0, 누적 70:8 로 쏠렸다.
    # 64k 로 peer 2-8개 상태를 담기에 충분하다.
    zone vllm_backend 64k;
    least_conn;                      # 진행 중 연결이 가장 적은 쪽으로. LLM 은 요청별 처리 시간 편차가 커서 라운드로빈보다 유리
    server host.docker.internal:8001 max_fails=3 fail_timeout=30s;
    server host.docker.internal:8002 max_fails=3 fail_timeout=30s;
    server host.docker.internal:8003 max_fails=3 fail_timeout=30s;
    server host.docker.internal:8004 max_fails=3 fail_timeout=30s;
    # keepalive 는 두지 않는다. LLM 요청은 초~분 단위라 커넥션 재사용 이득이 작고,
    # upstream keepalive 풀과 least_conn 의 연결 카운팅이 얽히면 분배가 한쪽으로 쏠린다(실측).
}

server {
    listen 8000;
    server_name _;

    # base64 data URI 로 이미지를 실어 보내므로 기본 1m 로는 부족하다.
    # 4464x2160 JPEG 를 base64 로 하면 수 MB 단위가 된다.
    client_max_body_size 128m;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://vllm_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 스트리밍(SSE) 응답을 버퍼링하면 토큰이 한꺼번에 몰려 나온다.
        proxy_buffering off;
        proxy_cache off;

        # 긴 생성·첫 요청의 커널 JIT 컴파일을 견디는 타임아웃.
        # 기본 60s 로는 이미지 요청이나 워밍업 중에 502 가 난다.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # LB 자체 헬스 (업스트림을 거치지 않는다)
    location = /lb-health {
        access_log off;
        return 200 "lb ok\n";
        add_header Content-Type text/plain;
    }
}
